name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck   # preinstalled on GitHub's Ubuntu runners
        run: shellcheck --version && shellcheck install.sh bin/* home/.bashrc shell/*.sh tests/helpers.bash

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats

      - name: Run tests
        run: bats --print-output-on-failure tests/

  # Install into a brand-new Ubuntu with nothing set up — the closest thing to a new laptop.
  install-on-clean-machine:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: ./install.sh

      - name: Second run changes nothing
        run: ./install.sh | tee out.txt && grep -q "^linked 0," out.txt

      - name: A new interactive shell picks everything up
        run: bash -i -c 'echo "DOTFILES=$DOTFILES" && type ll && type clean-branches'
